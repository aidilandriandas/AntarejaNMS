# ANTAREJA — live view CCTV lewat go2rtc. Hanya dua endpoint yang dibuka, keduanya wajib login (dicek Laravel).
# API go2rtc lain (mis. /api/streams yang memuat URL RTSP berkredensial) tidak pernah dapat diakses dari browser.
resolver 127.0.0.11 valid=30s ipv6=off;

location = /live/ws {
    auth_request /_live_auth;
    set $go2rtc http://go2rtc:1984;
    proxy_pass $go2rtc/api/ws$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location = /live/frame.jpeg {
    auth_request /_live_auth;
    set $go2rtc http://go2rtc:1984;
    proxy_pass $go2rtc/api/frame.jpeg$is_args$args;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store";
}

location = /_live_auth {
    internal;
    # $arg_src di subrequest kosong; kirim URI asli lewat header agar Laravel bisa memeriksa nama stream
    proxy_pass http://127.0.0.1/cctv/auth;
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
}
