# ANTAREJA NMS: pemindaian kerentanan dependensi (ISO/IEC 27001:2022 A.8.8, A.8.28).
# Jalan tiap push, pull request, dan tiap Senin pagi supaya CVE baru di dependensi lama tetap ketahuan.
name: Keamanan dependensi

on:
  push:
  pull_request:
  schedule:
    - cron: "17 23 * * 0"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: govulncheck (collector)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  php:
    name: composer audit (web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: composer audit
        run: composer audit --locked --no-interaction

  js:
    name: npm audit (web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
