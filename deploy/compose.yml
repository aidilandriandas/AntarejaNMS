# ANTAREJA NMS — collector + web + database + penyimpanan grafik
# Jalankan dari folder deploy:  cp .env.example .env  (isi nilainya)  lalu  docker compose up -d
name: antareja-core

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: antareja
      POSTGRES_USER: antareja
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antareja -d antareja"]
      interval: 10s
      retries: 10

  metrics:
    image: victoriametrics/victoria-metrics:v1.123.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-400d}
      - -httpListenAddr=:8428
    volumes:
      - metrics:/storage

  collector:
    build:
      context: ..
      dockerfile: collector/Dockerfile
      args:
        VERSION: ${ANTAREJA_TAG:-0.4.0}
    image: antareja-collector:${ANTAREJA_TAG:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      metrics:
        condition: service_started
    # ICMP tanpa hak istimewa untuk semua grup (bawaan Docker; ditulis eksplisit agar jelas)
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    # Syslog dari perangkat: arahkan ke IP VM port 514 (UDP atau TCP). IP pengirim asli tetap terlihat.
    ports:
      - "${SYSLOG_PORT:-514}:5514/udp"
      - "${SYSLOG_PORT:-514}:5514/tcp"
      # SNMP trap v1/v2c dari perangkat: arahkan trap ke IP VM port 162/UDP
      - "${TRAP_PORT:-162}:5162/udp"
    environment:
      ANTAREJA_DATABASE_URL: postgres://antareja:${DB_PASSWORD}@db:5432/antareja?sslmode=disable
      ANTAREJA_APP_KEY: ${ANTAREJA_APP_KEY:?isi ANTAREJA_APP_KEY di .env}
      ANTAREJA_VM_URL: http://metrics:8428
      ANTAREJA_PING_INTERVAL: ${PING_INTERVAL:-60s}
      ANTAREJA_SNMP_INTERVAL: ${SNMP_INTERVAL:-5m}
      ANTAREJA_LATENCY_HIGH_MS: ${LATENCY_HIGH_MS:-150}
      ANTAREJA_API_ADDR: ":9274"   # API internal untuk web (hanya jaringan Docker, tidak dipublikasikan)
      ANTAREJA_BASE_URL: ${APP_URL:-}   # tautan di pesan notifikasi
      ANTAREJA_GO2RTC_URL: http://go2rtc:1984   # cek kesehatan gambar CCTV
      ANTAREJA_CCTV_INTERVAL: ${CCTV_INTERVAL:-15m}
      ANTAREJA_SYSLOG_UDP: ":5514"   # penerima syslog (port tinggi di dalam container; collector bukan root)
      ANTAREJA_SYSLOG_TCP: ":5514"
      ANTAREJA_TRAP_UDP: ":5162"     # penerima SNMP trap (port tinggi di dalam container)
      TZ: ${TZ:-Asia/Jakarta}

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: antareja-web:${ANTAREJA_TAG:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      collector:
        condition: service_started
    ports:
      - "${HTTPS_PORT:-443}:443"    # HTTPS (sertifikat self-signed bawaan; ganti dengan sertifikat kantor bila ada)
      - "${HTTP_PORT:-80}:80"       # http://IP-VM dialihkan otomatis ke HTTPS
    environment:
      APP_NAME: ANTAREJA NMS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${ANTAREJA_APP_KEY}
      APP_URL: ${APP_URL:-https://localhost}
      APP_TIMEZONE: ${TZ:-Asia/Jakarta}
      APP_FORCE_HTTPS: "true"
      APP_HTTPS_PORT: ${HTTPS_PORT:-443}
      ANTAREJA_SYSLOG_PORT: ${SYSLOG_PORT:-514}
      ANTAREJA_TRAP_PORT: ${TRAP_PORT:-162}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: antareja
      DB_USERNAME: antareja
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_LIFETIME: "720"
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      ANTAREJA_COLLECTOR_URL: http://collector:9274
      ANTAREJA_METRICS_URL: http://metrics:8428
      ANTAREJA_VERSION: ${ANTAREJA_TAG:-0.4.0}
      ANTAREJA_BACKUP_DIR: /backups
      ANTAREJA_GO2RTC_URL: http://go2rtc:1984
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro   # hanya untuk unduh dari web

  go2rtc:
    # Server media (MIT) untuk live view CCTV: RTSP kamera -> MSE/WebSocket. Tidak ada port yang dipublikasikan.
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    environment:
      TZ: ${TZ:-Asia/Jakarta}

  backup:
    image: postgres:17.6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/antareja-backup.sh"]
    environment:
      PGHOST: db
      PGUSER: antareja
      PGDATABASE: antareja
      PGPASSWORD: ${DB_PASSWORD}
      ANTAREJA_VERSION: ${ANTAREJA_TAG:-0.4.0}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/antareja-backup.sh:ro
      # Arahkan BACKUP_DIR ke folder NAS yang di-mount di VM agar backup tersimpan di luar VM
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  db:
  metrics:
